[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vexel-eval-harness"
version = "0.1.0"
description = "High-precision evaluation harness for benchmarking quantized SLMs on quantitative trading schemas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VexelQuant Research", email = "research@vexelquant.me" }
]
keywords = [
    "quantitative-finance",
    "slm",
    "llm-evaluation",
    "gguf",
    "latency-benchmark",
    "trading",
    "schema-validation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment"
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "numpy>=1.24.0",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
vexel-eval = "vexel_eval.cli:app"

[project.urls]
Homepage = "https://vexelquant.me"
Repository = "https://github.com/VexelQuant/vexel-eval-harness"
HuggingFace = "https://huggingface.co/VexelQuant"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["."]
include = ["vexel_eval*"]
